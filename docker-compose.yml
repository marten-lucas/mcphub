services:
  mcphub:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcphub:feature-source-install-workflow
    container_name: mcphub
    restart: unless-stopped
    environment:
      PORT: 3000
      BASE_PATH: ${BASE_PATH:-/market}
      MCPHUB_DEPLOY_BUILD_ROOT: /var/lib/mcphub/deploy-builds
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    ports:
      - "${MCPHUB_PORT:-3000}:3000"
    volumes:
      - ${MCP_SETTINGS_PATH:-/opt/mcphub-data/mcp_settings.json}:/app/mcp_settings.json
      - ${CUSTOM_SERVERS_PATH:-/opt/mcphub-data/custom-servers.json}:/app/custom-servers.json
      - mcphub-data:/app/data
      - deploy-builds:/var/lib/mcphub/deploy-builds

volumes:
  mcphub-data:
    driver: local
  deploy-builds:
    driver: local
